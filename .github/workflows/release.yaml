name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          push: false
          load: true
          tags: loongson_dev:latest
          cache-from: type=gha,key=release-${{ github.sha }},mode=max
          cache-to: type=gha,key=release-${{ github.sha }},mode=max

      - name: Prepare workspace
        run: chmod -R 777 ${{ github.workspace }}

      - name: Build All
        run: |
          cd .devcontainer && docker compose run --rm loongson_devcontainer fish -c 'cd /workspace && just all'

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yml down || true
