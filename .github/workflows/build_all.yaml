name: build_all in docker

on:
  push:
    branches:
      - 'main'  # 触发条件：当代码推送到 main 分支时

  workflow_dispatch:

jobs:

build-job:
  runs-on: ubuntu-latest
  steps:
    # 1. 把你的代码从 GitHub 下载到虚拟机
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. 启动 Docker Compose 中定义的容器
    # -d 参数代表在后台运行
    - name: Start Docker Compose Services
      run: |
        docker compose -f .devcontainer/docker-compose.yml up -d

    # 3. 进入容器内部执行编译命令
    # 假设你的编译容器在 docker-compose.yml 里的服务名叫 "compiler"
    # 这行命令会让容器执行 "just all"
    - name: Run Compile Command inside Container
      run: |
        docker compose -f .devcontainer/docker-compose.yml exec -T loongson_devcontainer 'cd /workspace && just all'

    # 4. 把编译产物从容器中拷贝到虚拟机本地
    # 假设容器内部的编译产物存放在 /build/output 路径下
    # 我们将其拷贝到虚拟机的 ./dist 目录下
    - name: Extract Artifacts from Container
      run: |
        mkdir -p dist
        docker compose -f .devcontainer/docker-compose.yml cp loongson_devcontainer:/workspace/buildroot-2405/output/images/. ./dist/
        docker compose -f .devcontainer/docker-compose.yml cp loongson_devcontainer:/workspace/build/image.itb ./dist/

    # 6. 关闭并清理 Docker 容器，释放空间
    - name: Stop and Clean Containers
      run: |
        docker compose -f .devcontainer/docker-compose.yml down

    # 7. 自动创建 Release 并上传
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        with:
          files: |  # 这里填写训练生成的模型文件名
            dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub 自动生成的临时口令，用于获取发布权限
