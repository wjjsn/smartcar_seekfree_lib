name: build_all in docker

on:
  push:
    branches:
      - 'main'  # 触发条件：当代码推送到 main 分支时

  workflow_dispatch:

# 🔑 核心：显式赋予 GITHUB_TOKEN 写入 Release 的权限
permissions:
  contents: write # 必须赋予写权限，GitHub 才能创建 Release、Tag 并上传文件

jobs:

  build-job:
    runs-on: ubuntu-latest
    steps:
      # 1. 把你的代码从 GitHub 下载到虚拟机
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 启动 Docker Compose 中定义的容器
      # -d 参数代表在后台运行
      - name: Start Docker Compose Services
        run: |
          docker compose -f .devcontainer/docker-compose.yml up -d

      - name: Grant full permissions to workspace for Docker container
        # 777 权限可以让容器内的任何 UID 顺畅地在里面 mkdir 和写入文件
        run: chmod -R 777 ${{ github.workspace }}
      # 3. 进入容器内部执行编译命令
      # 假设你的编译容器在 docker-compose.yml 里的服务名叫 "compiler"
      # 这行命令会让容器执行 "just all"
      - name: Run Compile Command inside Container
        run: |
          docker compose -f .devcontainer/docker-compose.yml exec -T loongson_devcontainer fish -c 'cd /workspace && just all'

      # 6. 关闭并清理 Docker 容器，释放空间
      - name: Stop and Clean Containers
        run: |
          docker compose -f .devcontainer/docker-compose.yml down

      # 7. 自动创建 Release 并上传
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest-build"
          name: "待发布的临时草稿"
          draft: true
          files: |  # 这里填写训练生成的模型文件名
            build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub 自动生成的临时口令，用于获取发布权限
