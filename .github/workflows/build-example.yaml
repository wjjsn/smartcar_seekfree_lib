name: Build Example

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          push: false
          load: true
          tags: loongson_dev:latest
          cache-from: type=gha,key=build-example-${{ github.sha }},mode=max
          cache-to: type=gha,key=build-example-${{ github.sha }},mode=max

      - name: Prepare workspace
        run: chmod -R 777 ${{ github.workspace }}

      - name: Build Example
        run: |
          cd .devcontainer && docker compose run --rm loongson_devcontainer fish -c 'cd /workspace && just install-example'

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            Example/build
          key: build-example-${{ github.sha }}
          restore-keys: |
            build-example-

      - name: Cleanup
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yml down || true
