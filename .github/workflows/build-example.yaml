name: Build Example

on:
  push:
    branches: [main]
    paths:
      - 'Example/**'
      - '.devcontainer/**'
      - 'justfile'
  pull_request:
    branches: [main]
    paths:
      - 'Example/**'
      - '.devcontainer/**'
      - 'justfile'
  workflow_dispatch:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Example
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ env.IMAGE_NAME }}-${{ github.sha }}
          restore-keys: |
            buildx-${{ env.IMAGE_NAME }}-

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/smartcar-seekfree-lib:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      - name: Cache example build
        uses: actions/cache@v4
        id: cache-ex
        with:
          path: |
            Example/build/
          key: ex-${{ runner.os }}-${{ hashFiles('Example/CMakeLists.txt', 'Example/cross.cmake') }}
          restore-keys: |
            ex-${{ runner.os }}-

      - name: Build example
        run: |
          docker compose -f .devcontainer/docker-compose.yml run --rm \
            -w /workspace \
            --user root \
            loongson_devcontainer \
            bash -c '
              set -e
              cd Example
              cmake -G Ninja -B build -DCMAKE_TOOLCHAIN_FILE=cross.cmake \
                -DCMAKE_INSTALL_PREFIX=/workspace/buildroot-2405/output/target/home/root
              cmake --build build --parallel
            '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: example-artifacts
          path: Example/build/
          retention-days: 7