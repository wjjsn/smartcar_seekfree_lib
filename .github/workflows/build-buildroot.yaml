name: Build Buildroot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'buildroot-2405/**'
      - '.devcontainer/**'
      - 'justfile'
  push:
    branches: [main]
    paths:
      - 'buildroot-2405/**'
      - '.devcontainer/**'
      - 'justfile'

concurrency:
  group: buildroot-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Buildroot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ env.IMAGE_NAME }}-${{ hashFiles('.devcontainer/Dockerfile', '.devcontainer/docker-compose.yml') }}
          restore-keys: |
            buildx-${{ env.IMAGE_NAME }}-

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/smartcar-seekfree-lib:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache,mode=max

      - name: Cache buildroot output
        uses: actions/cache@v4
        id: cache-br
        with:
          path: |
            buildroot-2405/output/
          key: br-${{ runner.os }}-${{ hashFiles('buildroot-2405/.config', 'buildroot-2405/package/**/Config.in', 'buildroot-2405/package/**/Config.src') }}
          restore-keys: |
            br-${{ runner.os }}-

      - name: Build buildroot
        run: |
          cd .devcontainer && docker compose run --rm \
            -w /workspace \
            --user root \
            loongson_devcontainer \
            bash -c '
              set -e
              cd buildroot-2405
              mkdir -p output
              ./build.sh
            '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-artifacts
          path: buildroot-2405/output/
          retention-days: 7

      - name: Clear build cache
        if: always()
        run: rm -rf /tmp/.buildx-cache-new